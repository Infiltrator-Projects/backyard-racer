name: Repair vehicle art stream

on:
  push:
    paths:
      - ".github/workflows/repair-vehicle-art.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair packed vehicle art stream
        shell: python
        run: |
          import base64
          import pathlib
          import string
          import zlib

          paths = [
              pathlib.Path("src/vehicle_photo_chunks/sheet_00.inc"),
              pathlib.Path("src/vehicle_photo_chunks/sheet_01.inc"),
              pathlib.Path("src/vehicle_photo_chunks/sheet_02.inc"),
              pathlib.Path("src/vehicle_photo_chunks/sheet_03a.inc"),
              pathlib.Path("src/vehicle_photo_chunks/sheet_03b.inc"),
              pathlib.Path("src/vehicle_photo_chunks/sheet_03c.inc"),
          ]
          original_lengths = []
          parts = []
          for path in paths:
              text = path.read_text().strip()
              if text.startswith('"') and text.endswith('"'):
                  text = text[1:-1]
              text = "".join(text.split())
              original_lengths.append(len(text))
              parts.append(text)

          alphabet = string.ascii_uppercase + string.ascii_lowercase + string.digits + "+/"
          stream = "".join(parts)

          def decoded_bytes(s):
              clean = "".join(ch for ch in s if ch in alphabet or ch == "=")
              clean += "=" * ((4 - len(clean) % 4) % 4)
              return base64.b64decode(clean, validate=False)

          def progress(s):
              try:
                  data = decoded_bytes(s)
              except Exception as exc:
                  return False, 0, 0, f"base64: {exc}"
              dec = zlib.decompressobj()
              produced = 0
              consumed = 0
              step = 256
              try:
                  for start in range(0, len(data), step):
                      chunk = data[start:start + step]
                      out = dec.decompress(chunk)
                      produced += len(out)
                      consumed = start + len(chunk) - len(dec.unconsumed_tail)
                  out = dec.flush()
                  produced += len(out)
                  if dec.eof:
                      return True, len(data), produced, "ok"
                  return False, consumed, produced, "incomplete zlib stream"
              except zlib.error:
                  # Narrow the failing 256-byte block to a byte position.
                  block_start = max(0, consumed - step)
                  dec = zlib.decompressobj()
                  produced = 0
                  try:
                      if block_start:
                          out = dec.decompress(data[:block_start])
                          produced += len(out)
                      for i in range(block_start, min(len(data), block_start + step + 2)):
                          out = dec.decompress(data[i:i+1])
                          produced += len(out)
                      return False, min(len(data), block_start + step), produced, "zlib error"
                  except zlib.error as exc:
                      return False, i, produced, str(exc)

          ok, consumed, produced, msg = progress(stream)
          print(f"initial: ok={ok} consumed={consumed} produced={produced} msg={msg}")

          repairs = []
          for iteration in range(24):
              ok, consumed, produced, msg = progress(stream)
              if ok:
                  break

              center = max(0, min(len(stream) - 1, (consumed * 4) // 3))
              best = None

              # Search substitution first. A damaged manually embedded stream has
              # historically been single-character corruption, so this is both
              # fast and conservative.
              lo = max(0, center - 48)
              hi = min(len(stream), center + 49)
              for pos in range(lo, hi):
                  old = stream[pos]
                  for ch in alphabet:
                      if ch == old:
                          continue
                      candidate = stream[:pos] + ch + stream[pos+1:]
                      cok, ccons, cprod, cmsg = progress(candidate)
                      score = (1 if cok else 0, ccons, cprod)
                      if best is None or score > best[0]:
                          best = (score, "sub", pos, old, ch, candidate, cmsg)
                      if cok:
                          break
                  if best and best[0][0]:
                      break

              # If substitution does not move the decoder materially forward,
              # also check one-character deletion/insertion around the fault.
              if best is None or (not best[0][0] and best[0][1] <= consumed + 8):
                  for pos in range(lo, hi):
                      candidate = stream[:pos] + stream[pos+1:]
                      cok, ccons, cprod, cmsg = progress(candidate)
                      score = (1 if cok else 0, ccons, cprod)
                      if best is None or score > best[0]:
                          best = (score, "del", pos, stream[pos], "", candidate, cmsg)
                      if cok:
                          break
                  if not (best and best[0][0]):
                      for pos in range(lo, hi):
                          for ch in alphabet:
                              candidate = stream[:pos] + ch + stream[pos:]
                              cok, ccons, cprod, cmsg = progress(candidate)
                              score = (1 if cok else 0, ccons, cprod)
                              if best is None or score > best[0]:
                                  best = (score, "ins", pos, "", ch, candidate, cmsg)
                              if cok:
                                  break
                          if best and best[0][0]:
                              break

              if best is None or (not best[0][0] and best[0][1] <= consumed):
                  raise RuntimeError(
                      f"Unable to improve corrupt stream at compressed byte {consumed}, "
                      f"base64 position ~{center}"
                  )

              score, kind, pos, old, new, stream, cmsg = best
              repairs.append((kind, pos, old, new, score[1], score[2]))
              print(
                  f"repair {iteration+1}: {kind} pos={pos} {old!r}->{new!r}; "
                  f"decoder now reaches {score[1]} bytes / {score[2]} output bytes"
              )

          ok, consumed, produced, msg = progress(stream)
          if not ok:
              raise RuntimeError(
                  f"Stream still corrupt after {len(repairs)} repairs: "
                  f"consumed={consumed} produced={produced} msg={msg}"
              )

          raw = zlib.decompress(decoded_bytes(stream))
          print(f"repaired stream: compressed={len(decoded_bytes(stream))} decoded={len(raw)} repairs={repairs}")

          expected_rgb = 32 * 3 + 512 * 1920
          expected_rgba = 32 * 4 + 512 * 1920
          if len(raw) not in (expected_rgb, expected_rgba):
              raise RuntimeError(
                  f"Decoded vehicle sheet has unexpected size {len(raw)}; "
                  f"expected {expected_rgb} or {expected_rgba}"
              )

          # Preserve the original six-file layout, adjusting only the final
          # chunk if a repair inserted/deleted a character.
          offset = 0
          for index, path in enumerate(paths):
              if index + 1 == len(paths):
                  part = stream[offset:]
              else:
                  length = original_lengths[index]
                  part = stream[offset:offset + length]
                  offset += length
              path.write_text('"' + part + '"\n')

      - name: Commit repaired vehicle art
        shell: bash
        run: |
          if git diff --quiet -- src/vehicle_photo_chunks; then
            echo "Vehicle art stream already valid; nothing to commit."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vehicle_photo_chunks
          git commit -m "Repair embedded vehicle artwork stream"
          git pull --rebase origin main
          git push
