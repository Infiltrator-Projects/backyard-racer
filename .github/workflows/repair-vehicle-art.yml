name: Repair vehicle art stream

on:
  push:
    paths:
      - ".github/workflows/repair-vehicle-art.yml"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair packed vehicle art stream
        shell: python
        run: |
          import base64
          import pathlib
          import string
          import zlib

          paths = [
              pathlib.Path("src/vehicle_photo_chunks/sheet_00.inc"),
              pathlib.Path("src/vehicle_photo_chunks/sheet_01.inc"),
              pathlib.Path("src/vehicle_photo_chunks/sheet_02.inc"),
              pathlib.Path("src/vehicle_photo_chunks/sheet_03a.inc"),
              pathlib.Path("src/vehicle_photo_chunks/sheet_03b.inc"),
              pathlib.Path("src/vehicle_photo_chunks/sheet_03c.inc"),
          ]
          alphabet = string.ascii_uppercase + string.ascii_lowercase + string.digits + "+/"

          lengths = []
          parts = []
          for path in paths:
              text = path.read_text().strip()
              if text.startswith('"') and text.endswith('"'):
                  text = text[1:-1]
              text = "".join(text.split())
              lengths.append(len(text))
              parts.append(text)
          stream = "".join(parts)

          def decode64(s):
              s = "".join(ch for ch in s if ch in alphabet or ch == "=")
              s += "=" * ((4 - len(s) % 4) % 4)
              return base64.b64decode(s, validate=False)

          def locate_failure(data, start=0, state=None):
              dec = state.copy() if state is not None else zlib.decompressobj()
              pos = start
              produced = 0
              step = 2048
              while pos < len(data):
                  chunk = data[pos:min(len(data), pos + step)]
                  checkpoint = dec.copy()
                  try:
                      out = dec.decompress(chunk)
                      produced += len(out)
                      pos += len(chunk)
                  except zlib.error:
                      dec = checkpoint
                      for i, byte in enumerate(chunk):
                          try:
                              out = dec.decompress(bytes((byte,)))
                              produced += len(out)
                          except zlib.error as exc:
                              return False, pos + i, produced, str(exc)
                      return False, pos + len(chunk), produced, "zlib error"
              try:
                  produced += len(dec.flush())
              except zlib.error as exc:
                  return False, pos, produced, str(exc)
              return dec.eof, len(data), produced, "ok" if dec.eof else "incomplete stream"

          def checkpoint_for(data, upto):
              dec = zlib.decompressobj()
              if upto:
                  dec.decompress(data[:upto])
              return dec

          repairs = []
          for iteration in range(40):
              data = decode64(stream)
              ok, fail_byte, produced, msg = locate_failure(data)
              print(f"pass {iteration}: ok={ok} fail_byte={fail_byte} produced={produced} {msg}")
              if ok:
                  break

              center = max(0, min(len(stream) - 1, (fail_byte * 4) // 3))
              lo = max(0, center - 72)
              hi = min(len(stream), center + 41)

              # Candidate edits are all after this compressed-byte checkpoint.
              prefix_byte = max(0, (lo * 3) // 4 - 16)
              try:
                  prefix_state = checkpoint_for(data, prefix_byte)
              except zlib.error:
                  prefix_byte = max(0, fail_byte - 512)
                  prefix_state = checkpoint_for(data, prefix_byte)

              best = None

              def consider(candidate, kind, pos, old, new):
                  nonlocal_best = None
                  try:
                      cdata = decode64(candidate)
                      cok, cfail, cprod, cmsg = locate_failure(
                          cdata, prefix_byte, prefix_state
                      )
                  except Exception as exc:
                      return None
                  score = (1 if cok else 0, cfail, cprod)
                  return (score, candidate, kind, pos, old, new, cmsg)

              # Substitution is overwhelmingly the common failure mode for these
              # manually chunked generated assets.
              for pos in range(lo, hi):
                  old = stream[pos]
                  for new in alphabet:
                      if new == old:
                          continue
                      candidate = stream[:pos] + new + stream[pos + 1:]
                      item = consider(candidate, "sub", pos, old, new)
                      if item is not None and (best is None or item[0] > best[0]):
                          best = item
                      if best is not None and best[0][0]:
                          break
                  if best is not None and best[0][0]:
                      break

              # If substitution made no useful forward progress, allow one
              # character to have been dropped or duplicated.
              if best is None or (not best[0][0] and best[0][1] <= fail_byte + 4):
                  for pos in range(lo, hi):
                      candidate = stream[:pos] + stream[pos + 1:]
                      item = consider(candidate, "del", pos, stream[pos], "")
                      if item is not None and (best is None or item[0] > best[0]):
                          best = item
                  if best is None or (not best[0][0] and best[0][1] <= fail_byte + 4):
                      for pos in range(lo, hi):
                          for new in alphabet:
                              candidate = stream[:pos] + new + stream[pos:]
                              item = consider(candidate, "ins", pos, "", new)
                              if item is not None and (best is None or item[0] > best[0]):
                                  best = item
                              if best is not None and best[0][0]:
                                  break
                          if best is not None and best[0][0]:
                              break

              if best is None or (not best[0][0] and best[0][1] <= fail_byte):
                  raise RuntimeError(
                      f"Could not repair stream near compressed byte {fail_byte}, "
                      f"base64 position {center}"
                  )

              score, stream, kind, pos, old, new, cmsg = best
              repairs.append((kind, pos, old, new, score[1], score[2]))
              print(
                  f"repair {len(repairs)}: {kind} @{pos} {old!r}->{new!r}; "
                  f"next={score[1]} output={score[2]} {cmsg}"
              )
          else:
              raise RuntimeError("Vehicle artwork still corrupt after 40 repair passes")

          data = decode64(stream)
          raw = zlib.decompress(data)
          expected_rgb = 32 * 3 + 512 * 1920
          expected_rgba = 32 * 4 + 512 * 1920
          if len(raw) not in (expected_rgb, expected_rgba):
              raise RuntimeError(
                  f"Decoded vehicle sheet size {len(raw)} is not "
                  f"{expected_rgb} or {expected_rgba}"
              )
          print(f"vehicle sheet repaired: compressed={len(data)} decoded={len(raw)} repairs={repairs}")

          offset = 0
          for index, path in enumerate(paths):
              if index == len(paths) - 1:
                  part = stream[offset:]
              else:
                  part = stream[offset:offset + lengths[index]]
                  offset += lengths[index]
              path.write_text('"' + part + '"\n')

      - name: Commit repaired vehicle art
        shell: bash
        run: |
          if git diff --quiet -- src/vehicle_photo_chunks; then
            echo "Vehicle artwork already valid."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vehicle_photo_chunks
          git commit -m "Repair embedded vehicle artwork stream"
          git pull --rebase origin main
          git push
