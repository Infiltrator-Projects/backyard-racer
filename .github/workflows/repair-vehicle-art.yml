name: Repair vehicle art stream

on:
  push:
    paths:
      - ".github/workflows/repair-vehicle-art.yml"
      - ".github/scripts/repair_vehicle_art.py"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    timeout-minutes: 120
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Converge packed vehicle artwork
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          for pass in $(seq 1 80); do
            echo "=== vehicle artwork repair pass $pass ==="
            python3 .github/scripts/repair_vehicle_art.py

            if git diff --quiet -- src/vehicle_photo_chunks; then
              echo "Vehicle artwork stream is valid."
              exit 0
            fi

            git add src/vehicle_photo_chunks
            git commit -m "Repair embedded vehicle artwork corruption $pass"
            git pull --rebase origin main
            git push
          done

          echo "Vehicle artwork did not converge within 80 repairs." >&2
          exit 1
