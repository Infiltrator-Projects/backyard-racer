name: Repair vehicle art stream
# Manual convergence pass 10

on:
  push:
    paths:
      - ".github/workflows/repair-vehicle-art.yml"
      - "src/vehicle_photo_chunks/sheet_*.inc"

permissions:
  contents: write

jobs:
  repair:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          fetch-depth: 0

      - name: Repair one packed vehicle-art corruption
        shell: python
        run: |
          import base64
          import pathlib
          import string
          import zlib

          paths = [
              pathlib.Path("src/vehicle_photo_chunks/sheet_00.inc"),
              pathlib.Path("src/vehicle_photo_chunks/sheet_01.inc"),
              pathlib.Path("src/vehicle_photo_chunks/sheet_02.inc"),
              pathlib.Path("src/vehicle_photo_chunks/sheet_03a.inc"),
              pathlib.Path("src/vehicle_photo_chunks/sheet_03b.inc"),
              pathlib.Path("src/vehicle_photo_chunks/sheet_03c.inc"),
          ]
          alphabet = string.ascii_uppercase + string.ascii_lowercase + string.digits + "+/"
          expected_rgb = 32 * 3 + 512 * 1920
          expected_rgba = 32 * 4 + 512 * 1920
          expected_max = expected_rgba

          lengths = []
          parts = []
          for path in paths:
              text = path.read_text().strip()
              if text.startswith('"') and text.endswith('"'):
                  text = text[1:-1]
              text = "".join(text.split())
              lengths.append(len(text))
              parts.append(text)
          stream = "".join(parts)

          def decode64(s):
              s = "".join(ch for ch in s if ch in alphabet or ch == "=")
              s += "=" * ((4 - len(s) % 4) % 4)
              return base64.b64decode(s, validate=False)

          def locate_failure(data, start=0, state=None):
              dec = state.copy() if state is not None else zlib.decompressobj()
              pos = start
              produced = 0
              step = 2048
              while pos < len(data):
                  chunk = data[pos:min(len(data), pos + step)]
                  checkpoint = dec.copy()
                  try:
                      produced += len(dec.decompress(chunk))
                      pos += len(chunk)
                  except zlib.error:
                      dec = checkpoint
                      for i, byte in enumerate(chunk):
                          try:
                              produced += len(dec.decompress(bytes((byte,))))
                          except zlib.error as exc:
                              return False, pos + i, produced, str(exc)
                      return False, pos + len(chunk), produced, "zlib error"
              try:
                  produced += len(dec.flush())
              except zlib.error as exc:
                  return False, pos, produced, str(exc)
              return dec.eof, len(data), produced, "ok" if dec.eof else "incomplete stream"

          def checkpoint_for(data, upto):
              dec = zlib.decompressobj()
              produced = 0
              if upto:
                  produced += len(dec.decompress(data[:upto]))
              return dec, produced

          data = decode64(stream)
          ok, fail_byte, produced, msg = locate_failure(data)
          print(f"current: ok={ok} fail_byte={fail_byte} produced={produced} {msg}")

          if ok:
              raw = zlib.decompress(data)
              if len(raw) not in (expected_rgb, expected_rgba):
                  raise RuntimeError(f"Decoded stream is valid but has wrong size {len(raw)}")
              print(f"Vehicle artwork is valid: compressed={len(data)} decoded={len(raw)}")
              raise SystemExit(0)

          center = max(0, min(len(stream) - 1, (fail_byte * 4) // 3))
          lo = max(0, center - 16)
          hi = min(len(stream), center + 17)
          prefix_byte = max(0, (lo * 3) // 4 - 16)
          try:
              prefix_state, prefix_produced = checkpoint_for(data, prefix_byte)
          except zlib.error:
              prefix_byte = max(0, fail_byte - 256)
              prefix_state, prefix_produced = checkpoint_for(data, prefix_byte)

          best = None

          def consider(candidate, kind, pos, old, new):
              try:
                  cdata = decode64(candidate)
                  cok, cfail, cprod, cmsg = locate_failure(cdata, prefix_byte, prefix_state)
              except Exception:
                  return None
              total_produced = prefix_produced + cprod
              if total_produced > expected_max:
                  return None
              score = (1 if cok else 0, cfail, total_produced)
              return (score, candidate, kind, pos, old, new, cmsg)

          for pos in range(lo, hi):
              old = stream[pos]
              for new in alphabet:
                  if new == old:
                      continue
                  item = consider(stream[:pos] + new + stream[pos + 1:], "sub", pos, old, new)
                  if item is not None and (best is None or item[0] > best[0]):
                      best = item
                  if best is not None and best[0][0]:
                      break
              if best is not None and best[0][0]:
                  break

          # Always evaluate alignment repairs as well as substitutions. A
          # missing or duplicated Base64 character can otherwise masquerade as
          # dozens of tiny "successful" substitutions.
          for pos in range(lo, hi):
              item = consider(stream[:pos] + stream[pos + 1:], "del", pos, stream[pos], "")
              if item is not None and (best is None or item[0] > best[0]):
                  best = item

          for pos in range(lo, hi):
              for new in alphabet:
                  item = consider(stream[:pos] + new + stream[pos:], "ins", pos, "", new)
                  if item is not None and (best is None or item[0] > best[0]):
                      best = item

          if best is None or (not best[0][0] and best[0][1] <= fail_byte):
              raise RuntimeError(
                  f"No size-safe repair found near byte {fail_byte} / base64 {center}"
              )

          score, stream, kind, pos, old, new, cmsg = best
          print(
              f"selected repair: {kind} @{pos} {old!r}->{new!r}; "
              f"next_byte={score[1]} decoded={score[2]} {cmsg}"
          )

          offset = 0
          for index, path in enumerate(paths):
              if index == len(paths) - 1:
                  part = stream[offset:]
              else:
                  part = stream[offset:offset + lengths[index]]
                  offset += lengths[index]
              path.write_text('"' + part + '"\n')

      - name: Commit repair and trigger next pass
        shell: bash
        run: |
          if git diff --quiet -- src/vehicle_photo_chunks; then
            echo "Vehicle artwork stream needs no further edits."
            exit 0
          fi
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add src/vehicle_photo_chunks
          git commit -m "Repair next embedded vehicle artwork corruption"
          git pull --rebase origin main
          git push
