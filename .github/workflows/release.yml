name: Publish release

on:
  workflow_run:
    workflows: ["Backyard Racer CI"]
    types: [completed]

permissions:
  contents: read

concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false

jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main' &&
      startsWith(github.event.workflow_run.head_commit.message, 'Release ')
    runs-on: ubuntu-24.04
    permissions:
      contents: write
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
    steps:
      - name: Check out exact tested main commit
        uses: actions/checkout@v4
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
          submodules: recursive

      - name: Verify release identity
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA"
          version="$(sed -n 's/^project(BackyardRacer VERSION \([^ ]*\) LANGUAGES C CXX)$/\1/p' CMakeLists.txt)"
          test -n "$version"
          subject="$(git log -1 --format=%s HEAD)"
          if [[ "$subject" != "Release $version" && "$subject" != "Release $version:"* ]]; then
            echo "::error::Release commit subject must begin with Release $version."
            exit 1
          fi
          echo "VERSION=$version" >> "$GITHUB_ENV"

      - name: Install Linux build dependencies
        run: |
          sudo apt-get update
          sudo apt-get install -y --no-install-recommends build-essential cmake dpkg-dev libx11-dev

      - name: Rebuild generic Debian package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/build-deb.sh
          packaging/build-deb.sh build-package dist
          deb="dist/backyard-racer_${version}_amd64.deb"
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "backyard-racer"
          test "$(dpkg-deb -f "$deb" Version)" = "$VERSION"
          test "$(dpkg-deb -f "$deb" Architecture)" = "amd64"

      - name: Build deterministic source archive and checksums
        shell: bash
        run: |
          set -euo pipefail
          mkdir -p dist/source
          root="$RUNNER_TEMP/backyard-racer-source/backyard-racer-$VERSION"
          rm -rf "$(dirname "$root")"
          mkdir -p "$root"
          git archive --format=tar --prefix="backyard-racer-$VERSION/" "$EXPECTED_SHA" > "$RUNNER_TEMP/source.tar"
          gzip -n -c "$RUNNER_TEMP/source.tar" > "dist/source/backyard-racer_$VERSION_source.tar.gz"
          sha256sum "dist/backyard-racer_${version}_amd64.deb" "dist/source/backyard-racer_$VERSION_source.tar.gz" > dist/SHA256SUMS.txt

      - name: Publish immutable GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        shell: bash
        run: |
          set -euo pipefail
          tag="v$VERSION"
          deb="dist/backyard-racer_${version}_amd64.deb"
          source="dist/source/backyard-racer_$VERSION_source.tar.gz"
          if git rev-parse -q --verify "refs/tags/$tag" >/dev/null; then
            tag_commit="$(git rev-list -n 1 "$tag")"
            test "$tag_commit" = "$EXPECTED_SHA"
          else
            git tag "$tag" "$EXPECTED_SHA"
            git push origin "$tag"
          fi
          if gh release view "$tag" >/dev/null 2>&1; then
            existing="$(gh release view "$tag" --json assets --jq '.assets[].name' | sort)"
            expected="$(printf '%s\n%s\n%s\n' "$(basename "$deb")" "$(basename "$source")" "SHA256SUMS.txt" | sort)"
            test "$existing" = "$expected"
            echo "Release $tag already exists with the expected immutable asset set."
            exit 0
          fi
          gh release create "$tag" "$deb" "$source" dist/SHA256SUMS.txt \
            --verify-tag \
            --target "$EXPECTED_SHA" \
            --title "Backyard Racer $VERSION" \
            --generate-notes
