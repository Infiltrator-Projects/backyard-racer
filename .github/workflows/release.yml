name: Publish release
on:
  workflow_run:
    workflows: ["Backyard Racer CI"]
    types: [completed]
permissions:
  contents: read
  actions: read
concurrency:
  group: publish-release-${{ github.repository }}
  cancel-in-progress: false
jobs:
  publish:
    if: >-
      github.event.workflow_run.conclusion == 'success' &&
      github.event.workflow_run.event == 'push' &&
      github.event.workflow_run.head_branch == 'main'
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    permissions:
      contents: write
      actions: read
    env:
      EXPECTED_SHA: ${{ github.event.workflow_run.head_sha }}
      GH_TOKEN: ${{ github.token }}
    steps:
      - uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803
        with:
          ref: ${{ github.event.workflow_run.head_sha }}
          fetch-depth: 0
      - uses: actions/download-artifact@d3f86a106a0bac45b974a628896c90dbdf5c8093
        with:
          github-token: ${{ github.token }}
          run-id: ${{ github.event.workflow_run.id }}
          name: backyard-racer-qualified-${{ github.event.workflow_run.head_sha }}
          path: release
      - name: Promote exact qualified bytes
        shell: bash
        run: |
          set -euo pipefail
          git fetch origin main --tags
          test "$(git rev-parse origin/main)" = "$EXPECTED_SHA" || exit 0
          test "$(git rev-parse HEAD)" = "$EXPECTED_SHA"
          test "$(cat release/SOURCE_COMMIT)" = "$EXPECTED_SHA"
          (cd release && sha256sum -c SHA256SUMS.txt)
          version=$(tr -d '\r\n' < VERSION)
          tag="v$version"
          deb="backyard-racer_${version}_amd64.deb"
          source="backyard-racer_${version}_source.tar.gz"
          expected=$(printf '%s\n' "$deb" "$source" SOURCE_COMMIT SHA256SUMS.txt | sort)
          test "$(find release -maxdepth 1 -type f -printf '%f\n' | sort)" = "$expected"
          test "$(dpkg-deb -f "release/$deb" Package)" = backyard-racer
          test "$(dpkg-deb -f "release/$deb" Version)" = "$version"
          test "$(dpkg-deb -f "release/$deb" Architecture)" = amd64
          if git rev-parse -q --verify "refs/tags/$tag^{commit}" >/dev/null; then
            if [[ "$(git rev-parse "$tag^{commit}")" != "$EXPECTED_SHA" ]]; then
              gh release view "$tag" --json isDraft --jq .isDraft | grep -qx false
              echo "$tag already identifies an immutable release."
              exit 0
            fi
          fi
          if ! gh release view "$tag" --json isDraft,targetCommitish > "$RUNNER_TEMP/release-state"; then
            gh release create "$tag" --target "$EXPECTED_SHA" --draft --title "Backyard Racer $version" --generate-notes
            gh release view "$tag" --json isDraft,targetCommitish > "$RUNNER_TEMP/release-state"
          fi
          test "$(jq -r .targetCommitish "$RUNNER_TEMP/release-state")" = "$EXPECTED_SHA"
          draft=$(jq -r .isDraft "$RUNNER_TEMP/release-state")
          if [[ "$draft" == true ]]; then
            gh release upload "$tag" release/* --clobber
          fi
          verify_remote() {
            local destination
            destination=$(mktemp -d)
            gh release download "$tag" --dir "$destination"
            diff -qr release "$destination"
            rm -rf "$destination"
          }
          verify_remote
          if [[ "$draft" == true ]]; then
            gh release edit "$tag" --draft=false --latest
          fi
          verify_remote
          git fetch origin "refs/tags/$tag:refs/tags/$tag"
          test "$(git rev-parse "$tag^{commit}")" = "$EXPECTED_SHA"
