name: Backyard Racer CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout
        uses: actions/checkout@v4

      - name: Install X11 development files
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libx11-dev

      - name: Configure
        run: cmake -S . -B build -DCMAKE_BUILD_TYPE=Release

      - name: Build
        run: cmake --build build --parallel

      - name: Test gameplay core
        run: ctest --test-dir build --output-on-failure

      - name: Verify shared project metadata
        run: |
          ./build/backyard-racer --version
          ./build/backyard-racer --project-info

      - name: Verify generic Debian package
        shell: bash
        run: |
          set -euo pipefail
          chmod +x packaging/build-deb.sh
          packaging/build-deb.sh build-package dist
          version="$(sed -n 's/^project(BackyardRacer VERSION \([^ ]*\) LANGUAGES C CXX)$/\1/p' CMakeLists.txt)"
          deb="dist/backyard-racer_${version}_amd64.deb"
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "backyard-racer"
          dpkg-deb --fsys-tarfile "$deb" | tar -tf - | grep -qx './usr/bin/backyard-racer'

      - name: Verify hardware-native source install
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DBACKYARD_BUILD_PROFILE=native
          cmake --build build-native --parallel
          ctest --test-dir build-native --output-on-failure
          rm -rf native-stage
          DESTDIR="$PWD/native-stage" cmake --install build-native --component Runtime --prefix /usr
          test -x native-stage/usr/bin/backyard-racer

      - name: Upload generic Debian package
        uses: actions/upload-artifact@v4
        with:
          name: backyard-racer-linux-amd64
          path: dist/backyard-racer_0.6.0_amd64.deb
          if-no-files-found: error
