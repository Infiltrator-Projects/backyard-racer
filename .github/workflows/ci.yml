name: Backyard Racer CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  linux:
    runs-on: ${{ fromJSON(github.event_name == 'pull_request' && '["ubuntu-24.04"]' || '["self-hosted","Linux","X64","linux-native"]') }}
    env:
      PATH: /usr/local/sbin:/usr/local/bin:/usr/sbin:/usr/bin:/sbin:/bin
    steps:
      - name: Checkout
        uses: actions/checkout@d23441a48e516b6c34aea4fa41551a30e30af803

      - name: Install X11 development files
        if: runner.environment == 'github-hosted'
        run: |
          sudo apt-get update
          sudo apt-get install -y dpkg-dev libx11-dev

      - name: Verify self-hosted X11 dependencies
        if: runner.environment == 'self-hosted'
        shell: bash
        run: |
          set -euo pipefail
          for command_name in cmake ctest dpkg-deb pkg-config; do
            command -v "$command_name" >/dev/null 2>&1 || exit 1
          done
          pkg-config --exists x11

      - name: Verify generic Debian package
        shell: bash
        run: |
          set -euo pipefail
          bash packaging/build-deb.sh build-package dist
          ./build-package/backyard-racer --version
          ./build-package/backyard-racer --project-info
          version="$(tr -d '\r\n' < VERSION)"
          deb="dist/backyard-racer_${version}_amd64.deb"
          test -s "$deb"
          test "$(dpkg-deb -f "$deb" Package)" = "backyard-racer"
          dpkg-deb --fsys-tarfile "$deb" | tar -tf - > package-files.txt
          grep -Fx './usr/bin/backyard-racer' package-files.txt

      - name: Verify hardware-native source install
        shell: bash
        run: |
          set -euo pipefail
          cmake -S . -B build-native -DCMAKE_BUILD_TYPE=Release -DBACKYARD_BUILD_PROFILE=native
          cmake --build build-native --parallel
          ctest --test-dir build-native --output-on-failure
          rm -rf native-stage
          DESTDIR="$PWD/native-stage" cmake --install build-native --component Runtime --prefix /usr
          test -x native-stage/usr/bin/backyard-racer

      - name: Seal qualified package and source
        shell: bash
        run: |
          set -euo pipefail
          version=$(tr -d '\r\n' < VERSION)
          git archive --format=tar --prefix="backyard-racer-$version/" HEAD | gzip -n > "dist/backyard-racer_${version}_source.tar.gz"
          printf '%s\n' "$GITHUB_SHA" > dist/SOURCE_COMMIT
          (cd dist && sha256sum *.deb *.tar.gz SOURCE_COMMIT > SHA256SUMS.txt)
      - name: Preserve qualified release bundle
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02
        with:
          name: backyard-racer-qualified-${{ github.sha }}
          path: dist/*
          if-no-files-found: error
          retention-days: 14
